name: Publicar portafolio

on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  package:
    name: Empaquetar el portafolio
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Descargar el contenido del repositorio
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empaquetar el portafolio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publicar en GitHub Pages
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
